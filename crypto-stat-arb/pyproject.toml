[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qsa"
version = "0.1.0"
description = "Crypto statistical-arbitrage research toolkit: self-contained data, backtest engine, metrics, and signal library."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.1,<3",
    "pyarrow>=15",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["qsa"]

[tool.ruff]
line-length = 120
exclude = ["scripts", "notebooks"]

[tool.ruff.lint]
# Keep it light: the notebooks favour terse, packed research code by design.
ignore = ["E402", "E741", "E731"]
