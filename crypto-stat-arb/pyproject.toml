[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qsa"
version = "0.1.0"
description = "Crypto statistical-arbitrage research toolkit: self-contained data, backtest engine, metrics, and signal library."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "statsmodels",
    "matplotlib",
]

[tool.setuptools]
packages = ["qsa"]
