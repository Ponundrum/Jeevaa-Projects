[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mmlab"
version = "0.1.0"
description = "A market-making laboratory: Avellaneda-Stoikov quoting, a Poisson fill simulator, and data-measured adverse selection fed back into the sim."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.11",
    "pandas>=2.1,<3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.12.0"]  # pinned: linting is a style gate, so the version is fixed for reproducible CI

[tool.setuptools]
packages = ["mmlab"]

[tool.ruff]
line-length = 120
exclude = ["scripts", "notebooks"]

[tool.ruff.lint]
ignore = ["E402", "E741", "E731"]
