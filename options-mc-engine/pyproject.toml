[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qmc"
version = "0.1.0"
description = "From-scratch Monte Carlo derivatives-pricing and rough-volatility engine, validated against closed-form Black-Scholes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.11",
    "pandas>=2.1,<3",
    "matplotlib>=3.7",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["qmc"]

[tool.ruff]
line-length = 120
exclude = ["scripts", "notebooks"]

[tool.ruff.lint]
ignore = ["E402", "E741", "E731"]
