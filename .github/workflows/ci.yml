name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  crypto-stat-arb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto-stat-arb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check qsa tests
      - name: Test
        run: pytest -q

  options-mc-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: options-mc-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check qmc tests
      - name: Test
        run: pytest -q

  mm-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mm-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check mmlab tests
      - name: Test
        run: pytest -q
